$kind: http-request
url: "{{base_url}}/api.php?route=submissions"
method: PUT
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_token}}"
body:
  type: json
  content: '{"student_id": "{{student_id}}", "task_id": "{{task_id}}", "status": "submitted"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Submitted", () => pm.expect(pm.response.json().data.status).to.eql("submitted"));
    language: text/javascript
order: 7000
