$kind: http-request
url: "{{base_url}}/api.php?route=tasks"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_token}}"
body:
  type: json
  content: '{"title": "Postman test task", "subject": "CS0053", "due_date": "2099-12-31", "description": "Temporary record created during API testing."}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("task_id", pm.response.json().data.id);
    language: text/javascript
order: 6000
